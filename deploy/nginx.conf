# Gateway routing for the cli-agent service.
#
# Include this from the ProcessGPT gateway's server block. The browser calls
# /process-gpt-cli-agent/… and the service serves paths at its own root, so the
# prefix is stripped on the way through.

location /process-gpt-cli-agent/ {
    proxy_pass http://cli-agent:8890/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    # A CLI agent run takes minutes and streams the whole time. Both of these
    # matter: buffering turns a live stream into one lump at the end, and the
    # default read timeout kills the connection long before a run finishes.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    # Skill uploads carry zipped folders.
    client_max_body_size 50m;
}
