name: Build and Push process-gpt-cli-agent

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - '**/*.py'
      - 'skills/**'
      - 'system-skills/**'
      - '.github/workflows/process-gpt-cli-agent.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/uengine-oss/process-gpt-cli-agent:${{ env.IMAGE_TAG }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: uengine-oss/process-gpt-k8s
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo
          persist-credentials: false

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps image
        env:
          IMAGE_NAME: ghcr.io/uengine-oss/process-gpt-cli-agent:${{ env.IMAGE_TAG }}
        run: |
          cd gitops-repo
          test -f deployments/process-gpt-cli-agent.yaml
          # Deployment 문서에만 쓴다.
          #
          # 문서 선택자 없이 돌리면 이 파일의 **모든** 문서에 적용된다. yq 의 대입은
          # 없는 경로를 만들어 내므로, 같은 파일에 있는 PersistentVolumeClaim 에
          # spec.template.spec.containers[0].image 가 생긴다. PVC 에 없는 필드라
          # kubectl 패치가 거부되고, 그러면 이 앱의 모든 ArgoCD sync 가 함께 실패해
          # 다른 서비스 배포까지 멈춘다 — 실제로 그래서 deepagents 가 CI 성공에도
          # 옛 이미지에 머물렀다.
          yq eval -i \
            '(select(.kind == "Deployment") | .spec.template.spec.containers[0].image) = strenv(IMAGE_NAME)' \
            deployments/process-gpt-cli-agent.yaml

      - name: Commit and push GitOps change
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          cd gitops-repo
          git remote set-url origin "https://x-access-token:${GITOPS_PAT}@github.com/uengine-oss/process-gpt-k8s.git"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add deployments/process-gpt-cli-agent.yaml
          if git diff --cached --quiet; then
            echo "GitOps manifest already points to this image"
          else
            git commit -m "Update cli-agent image to ${IMAGE_TAG}"
            git push
          fi
