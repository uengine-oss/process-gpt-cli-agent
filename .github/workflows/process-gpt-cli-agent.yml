name: Build and Push process-gpt-cli-agent

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - '**/*.py'
      - 'skills/**'
      - 'system-skills/**'
      - '.github/workflows/process-gpt-cli-agent.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/uengine-oss/process-gpt-cli-agent:${{ env.IMAGE_TAG }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: uengine-oss/process-gpt-k8s
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo
          persist-credentials: false

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update GitOps image
        env:
          IMAGE_NAME: ghcr.io/uengine-oss/process-gpt-cli-agent:${{ env.IMAGE_TAG }}
        run: |
          cd gitops-repo
          test -f deployments/process-gpt-cli-agent.yaml
          yq eval '.spec.template.spec.containers[0].image = strenv(IMAGE_NAME)' \
            -i deployments/process-gpt-cli-agent.yaml

      - name: Commit and push GitOps change
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          cd gitops-repo
          git remote set-url origin "https://x-access-token:${GITOPS_PAT}@github.com/uengine-oss/process-gpt-k8s.git"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add deployments/process-gpt-cli-agent.yaml
          if git diff --cached --quiet; then
            echo "GitOps manifest already points to this image"
          else
            git commit -m "Update cli-agent image to ${IMAGE_TAG}"
            git push
          fi
